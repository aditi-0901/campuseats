openapi: 3.0.3
info:
  title: CampusEats Orders
  version: "6.0.0"
  description: >
    Order Service for CampusEats. All endpoints require a Bearer token (B3,
    Assignment 5) and are subject to per-client rate limiting (B5, Assignment
    5; X-RateLimit-* response headers on every response). CORS is enabled on
    every endpoint (B6, Assignment 5).


    Assignment 6 adds: every failure response is Problem Details
    (type/title/status/detail[/errors]) served as
    application/problem+json (B1); POST /orders validates its whole body
    before doing any work and, on failure, returns a single 422 listing
    every bad field at once, not just the first (C1/C2); GET /orders/{id}
    honours content negotiation and can return the same order as either
    application/json (default) or application/xml, with 406 if neither is
    acceptable to the caller (C3); every response carries a charset on its
    Content-Type (C4).
servers:
  - url: http://localhost:8081

security:
  - bearerAuth: []

paths:
  /orders:
    post:
      summary: Place a new order
      description: >
        Body is validated in full before any work is done (payment included)
        — see RequestBody schema below and NOTES.md Part C. A validation
        failure is always one 422 listing every bad field, never just the
        first one found.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
      responses:
        "201":
          description: Order created
          headers:
            Location:
              description: URL of the newly created order
              schema: { type: string }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "200":
          description: >
            Idempotent replay (C3, Assignment 5) — the same Idempotency-Key
            was seen before, so the original order is returned unchanged and
            no second charge is attempted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: >
            The request body could not even be parsed as JSON (malformed-json).
            Distinct from 422 below: this request never reached validation.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401":
          description: Missing or malformed Bearer token (unauthorized)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "406":
          description: Client's Accept header matches neither application/json nor application/xml (not-acceptable)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: >
            Either validation-failed (the body parsed as JSON but failed one
            or more field checks — see `errors`, which always lists every
            bad field found, C1/C2) or payment-declined (the body was valid
            but the bank refused the charge — see `detail`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Rate limit exceeded (rate-limit-exceeded)
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: >
            Payments service unreachable after retries (payments-unavailable).
            `detail` is always a clean, stable message — never the raw
            transport error (see NOTES.md Q6).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    get:
      summary: List orders (filter, sort, paginate)
      parameters:
        - in: query
          name: student
          schema: { type: integer }
          description: Filter to a single student's orders
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
        - in: query
          name: sort
          schema: { type: string, enum: [createdAt, id], default: createdAt }
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
        "400":
          description: Invalid query parameters (invalid-query) — every bad parameter reported together
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401":
          description: Missing or malformed Bearer token (unauthorized)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    options:
      summary: Discover the methods supported on /orders (A5, Assignment 5)
      responses:
        "204":
          description: No Content
          headers:
            Allow:
              schema: { type: string, example: "GET, POST, OPTIONS" }

  /orders/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      summary: Read a single order
      description: >
        Supports conditional GET (C1, Assignment 5) and content negotiation
        (C3, Assignment 6) — the same order can be read as JSON (default) or
        XML depending on Accept.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/Accept"
      responses:
        "200":
          description: Order details, as JSON (default) or XML depending on Accept (C3)
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string, example: "private, max-age=60" } }
            Vary: { schema: { type: string, example: "Accept" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
            application/xml:
              schema: { $ref: "#/components/schemas/Order" }
        "304":
          description: >
            Not Modified (C1, Assignment 5) — the client's If-None-Match
            matched the current ETag; body is empty.
        "401":
          description: Missing or malformed Bearer token (unauthorized)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Order not found (order-not-found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "406":
          description: Client's Accept header matches neither application/json nor application/xml (not-acceptable)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      summary: Delete an order (stub — accepts the verb, does not remove state; see NOTES.md A2/A5, Assignment 5)
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or malformed Bearer token (unauthorized)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Order not found (order-not-found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /orders/{id}/cancel:
    post:
      summary: Cancel an order (non-CRUD action, A2 — Assignment 5)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "202":
          description: Cancellation accepted; order status is now "cancelled"
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  status: { type: string }
        "401":
          description: Missing or malformed Bearer token (unauthorized)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Order not found (order-not-found)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: >
            Order is not in a cancellable state (illegal-transition — renamed
            from Assignment 5's "state-conflict" to match the assignment's
            own type-catalogue vocabulary; same meaning, see NOTES.md Q2).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "412":
          description: >
            Precondition Failed (C2, Assignment 5) — the supplied If-Match no
            longer matches the order's current ETag; the client read a stale
            version and must GET again before retrying.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string }
      description: >
        Client-generated key (C3, Assignment 5). Replaying the same key
        returns the original order instead of creating a duplicate and
        re-charging.
    IfNoneMatch:
      in: header
      name: If-None-Match
      required: false
      schema: { type: string }
      description: Conditional GET (C1, Assignment 5); matching value yields 304.
    IfMatch:
      in: header
      name: If-Match
      required: false
      schema: { type: string }
      description: Conditional write (C2, Assignment 5); stale value yields 412.
    Accept:
      in: header
      name: Accept
      required: false
      schema: { type: string, default: "application/json" }
      description: >
        application/json (default) or application/xml (C3, Assignment 6).
        Anything else is rejected with 406.
  schemas:
    OrderRequest:
      type: object
      required: [studentId, itemId, qty, paymentMethodId]
      description: >
        CampusEats' actual order body: one line item per order. See
        validation.js / NOTES.md Part C "Note on scope" for why this does
        not have the generic assignment example's items[]/address shape.
      properties:
        studentId: { type: integer }
        itemId: { type: integer }
        qty: { type: integer, minimum: 1 }
        paymentMethodId: { type: string, minLength: 1 }
    Order:
      type: object
      properties:
        id: { type: integer }
        studentId: { type: integer }
        itemId: { type: integer }
        qty: { type: integer }
        status: { type: string, enum: [placed, cancelled] }
        createdAt: { type: string, format: date-time }
    Problem:
      type: object
      description: >
        RFC 7807-style Problem Details (B1, Assignment 6). Served with
        Content-Type: application/problem+json on every failure response.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          description: Stable, slash-prefixed error type slug — see NOTES.md Q2 for the full catalogue.
          example: "/errors/validation-failed"
        title:
          type: string
          example: "Request failed validation"
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: "The request body failed validation."
        errors:
          type: array
          description: >
            Present only on field-level validation failures (B3/C2,
            Assignment 6). Every bad field is listed in the one response —
            never just the first.
          items:
            type: object
            required: [field, reason]
            properties:
              field: { type: string, example: "qty" }
              reason: { type: string, example: "required integer, minimum 1" }
