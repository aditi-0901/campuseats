<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusEats Menu (GraphQL)</title>
  <style>
    :root {
      --bg: #faf6f0;
      --card: #ffffff;
      --ink: #2b2118;
      --muted: #7a6a5a;
      --line: #eadfce;
      --accent: #d9480f;
      --accent-dark: #b03a0b;
      --ok-bg: #e6f4ea;  --ok-ink: #1e6b34;
      --off-bg: #f1ece4; --off-ink: #7a6a5a;
      --err-bg: #fdecea; --err-ink: #a12622;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px 56px;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; }
    header { margin-bottom: 20px; }
    h1 { margin: 0; font-size: 1.7rem; letter-spacing: -0.01em; }
    h1 span { color: var(--accent); }
    .sub { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 18px;
    }
    h2 { margin: 0 0 12px; font-size: 1.05rem; }
    .count { color: var(--muted); font-weight: 400; font-size: 0.9rem; }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    tr:last-child td { border-bottom: none; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.id { color: var(--muted); width: 3rem; }
    tr.new { animation: flash 2.4s ease-out; }
    @keyframes flash { from { background: #fff1c7; } to { background: transparent; } }

    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
    .badge.yes { background: var(--ok-bg);  color: var(--ok-ink); }
    .badge.no  { background: var(--off-bg); color: var(--off-ink); }

    form { display: grid; grid-template-columns: 1fr 120px auto; gap: 10px; align-items: end; }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 3px; }
    input {
      width: 100%; padding: 9px 10px; font: inherit; color: inherit;
      border: 1px solid #d8c9b3; border-radius: 8px; background: #fff;
    }
    input:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid #f5b895; outline-offset: 1px; }
    button {
      padding: 10px 18px; font: inherit; font-weight: 600; color: #fff;
      background: var(--accent); border: none; border-radius: 8px; cursor: pointer;
    }
    button:hover { background: var(--accent-dark); }
    button:disabled { opacity: 0.6; cursor: progress; }

    #message { min-height: 1.5em; margin: 12px 0 0; font-size: 0.93rem; }
    #message.ok  { color: var(--ok-ink); }
    #message.err { color: var(--err-ink); background: var(--err-bg); padding: 8px 10px; border-radius: 8px; }

    details { color: var(--muted); font-size: 0.9rem; }
    summary { cursor: pointer; }
    pre {
      margin: 10px 0 0; padding: 12px; overflow-x: auto;
      background: #2b2118; color: #f6e9d6; border-radius: 8px;
      font: 0.82rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    @media (max-width: 520px) {
      form { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Campus<span>Eats</span> Menu</h1>
      <p class="sub">Catalogue Service &middot; read and written through a GraphQL API</p>
    </header>

    <section class="card">
      <h2>Today's menu <span class="count" id="count"></span></h2>
      <table>
        <thead>
          <tr><th>ID</th><th>Dish</th><th class="num">Price</th><th>Status</th></tr>
        </thead>
        <tbody id="dishes">
          <tr><td colspan="4">Loading&hellip;</td></tr>
        </tbody>
      </table>
    </section>

    <section class="card">
      <h2>Add a dish</h2>
      <form id="add-form" novalidate>
        <div>
          <label for="name">Dish name</label>
          <input id="name" name="name" type="text" maxlength="100" placeholder="Paneer Roll" required autocomplete="off">
        </div>
        <div>
          <label for="price">Price (&#8377;)</label>
          <input id="price" name="price" type="number" min="0" step="0.01" placeholder="90" required>
        </div>
        <button type="submit" id="add-button">Add dish</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <details>
        <summary>The two GraphQL operations this page sends</summary>
<pre id="ops"></pre>
      </details>
    </section>
  </main>

  <script>
    // When this page is served by the API itself (http://localhost:4000/) the
    // endpoint is just /graphql. If the file is opened straight from disk, or
    // from a separate dev server such as VS Code Live Server (port 5500), it
    // calls the API on port 4000 instead (the server allows that via CORS).
    const GRAPHQL_URL =
      location.protocol === 'file:' || location.port === '5500'
        ? 'http://localhost:4000/graphql'
        : '/graphql';

    const LIST_DISHES = `query {
  dishes { id name price available }
}`;

    const ADD_DISH = `mutation AddDish($input: AddDishInput!) {
  addDish(input: $input) { id name price available }
}`;

    document.getElementById('ops').textContent =
      LIST_DISHES + '\n\n' + ADD_DISH + '\n\n# variables\n{ "input": { "name": "Paneer Roll", "price": 90 } }';

    const tbody = document.getElementById('dishes');
    const countEl = document.getElementById('count');
    const form = document.getElementById('add-form');
    const nameInput = document.getElementById('name');
    const priceInput = document.getElementById('price');
    const button = document.getElementById('add-button');
    const message = document.getElementById('message');

    // Send one GraphQL operation; return its data or throw an Error with a readable message.
    async function gql(query, variables) {
      let res;
      try {
        res = await fetch(GRAPHQL_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, variables }),
        });
      } catch (e) {
        throw new Error('Cannot reach the GraphQL API at ' + GRAPHQL_URL + '. Is the server running (npm start)?');
      }
      let body;
      try {
        body = await res.json();
      } catch (e) {
        throw new Error('The server did not answer with GraphQL JSON (HTTP ' + res.status + ').');
      }
      if (body.errors && body.errors.length) throw new Error(body.errors[0].message);
      return body.data;
    }

    const rupees = (n) => '₹' + Number(n).toFixed(2);

    function cell(text, className) {
      const td = document.createElement('td');
      td.textContent = text;
      if (className) td.className = className;
      return td;
    }

    // Everything from the API goes in with textContent, never innerHTML,
    // so a dish named "<b>x</b>" is shown as text and cannot inject markup.
    function render(dishes, highlightId) {
      tbody.replaceChildren();
      if (dishes.length === 0) {
        const tr = document.createElement('tr');
        const td = cell('No dishes yet.');
        td.colSpan = 4;
        tr.appendChild(td);
        tbody.appendChild(tr);
      }
      for (const d of dishes) {
        const tr = document.createElement('tr');
        if (highlightId && d.id === highlightId) tr.className = 'new';
        const status = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = 'badge ' + (d.available ? 'yes' : 'no');
        badge.textContent = d.available ? 'Available' : 'Sold out';
        status.appendChild(badge);
        tr.append(cell(d.id, 'id'), cell(d.name), cell(rupees(d.price), 'num'), status);
        tbody.appendChild(tr);
      }
      countEl.textContent = '(' + dishes.length + (dishes.length === 1 ? ' dish)' : ' dishes)');
    }

    function say(text, kind) {
      message.textContent = text;
      message.className = kind || '';
    }

    async function loadDishes(highlightId) {
      const data = await gql(LIST_DISHES);
      render(data.dishes, highlightId);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const name = nameInput.value.trim();
      const price = priceInput.value === '' ? NaN : Number(priceInput.value);
      if (!name) return say('Please enter a dish name.', 'err');
      if (!Number.isFinite(price) || price < 0) return say('Please enter a price of 0 or more.', 'err');

      button.disabled = true;
      say('Adding…');
      try {
        const data = await gql(ADD_DISH, { input: { name, price } });
        const dish = data.addDish;
        await loadDishes(dish.id);      // re-read the list so the page shows what is really in MySQL
        say('Added “' + dish.name + '” (id ' + dish.id + ', ' + rupees(dish.price) + ').', 'ok');
        form.reset();
        nameInput.focus();
      } catch (e) {
        say(e.message, 'err');
      } finally {
        button.disabled = false;
      }
    });

    loadDishes().catch((e) => {
      tbody.replaceChildren();
      const tr = document.createElement('tr');
      const td = cell('Could not load the menu.');
      td.colSpan = 4;
      tr.appendChild(td);
      tbody.appendChild(tr);
      say(e.message, 'err');
    });
  </script>
</body>
</html>
